// Hyperdrive settings (shipped defaults).
// Do not edit this file to change a setting: updates overwrite it.
// Instead create GameData/Hyperdrive/PluginData/Hyperdrive.user.cfg with a HYPERDRIVE node
// containing only the values you want to change, for example:
//
//   HYPERDRIVE
//   {
//       SUBSYSTEMS
//       {
//           LogSpamGuard = false
//       }
//   }
//
// Every subsystem can be switched off here if it conflicts with another mod. Restart KSP after a change.

HYPERDRIVE
{
	// Extra [debug] lines in KSP.log.
	debugLogging = false

	SUBSYSTEMS
	{
		// Problems during the first load (errors and exceptions from any mod or the game, DLLs KSP did not load, missing
		// dependencies), each charged to its GameData folder: shown over the loading screen, listed at the main menu and in
		// KSP.log, so that players can find what is broken. Read-only.
		LoadProblems = true
		// Editor (VAB/SPH) part list: each part's tags split once instead of at every search, and icons kept in the list's
		// grid between refreshes instead of being moved out and back. Same list, same order. Left to KSPCF when it has it.
		// First load: .mu models read ahead on a worker thread; the game parses them from memory instead of many small
		// disk reads. Same bytes, same parser. Stands down with KSPCF.
		ModelPrefetch = true
		// First load: while the parts compile, a localized text asked again (hundreds of times per part) is given from a cache
		// (same answer: the first 2,000 are checked against the game's own). Dropped at the main menu.
		LocalizerCache = true
		// First load: the part compilation (parts, internal props, internal spaces) runs as one coroutine instead of nested
		// ones that each cost frames; a frame is given back every 30 ms of work. Same parts, same order. Stands down with KSPCF.
		PartCompilePacing = true
		// FlightGlobals.fetch searched at most once per frame while there is none (thousands of searches during loading),
		// and for the first load only: Unity's asynchronous loading priority and texture upload slices raised, vsync and
		// the frame cap lifted; all restored at the main menu.
		LoadingBoost = true
		// ModuleManager writes no cache when one patch of the modpack has an error, and patches everything again at every
		// start (minutes on a big modpack). Its cache is written anyway (same files, same result; any change: patched again),
		// and its errors are shown as load problems.
		ModuleManagerCache = true
		PartListPerf = true
		// Editor: the part icons the list can show are created ahead, a few ms per frame once the editor is open, instead of
		// all at once on the first search or category that shows them (the freeze). Same icons, as the list creates them.
		IconPrewarm = true
		// Hyperdrive's interface: a section in KSP's in-game settings (main switches), the logo in KSP's toolbar and at the top
		// right of the main menu, Alt+F10: a panel with Features (each subsystem), Performance (time per frame of each mod,
		// measured on demand) and Loading screens.
		HyperdriveWindow = true
		// Logs machine, graphics API, GC mode, memory, load time and a Harmony audit. Read-only.
		Probe = true
		// Collapses identical log messages spammed by mods into periodic summaries.
		LogSpamGuard = true
		// First load: parses every GameData .cfg on worker threads while the other mods start, so that KSP's second
		// pass over the config files finds them ready (same parser, same result). Stands down with KSPCF.
		ConfigPrefetch = true
		// Stock startup fixes, same result: config localization in one pass instead of a quadratic one (~7 s with
		// thousands of configs).
		StartupFixes = true
		// First load: the Start of the "Instantly" mods (~13 s in one frozen frame with many mods) runs a few per frame,
		// so the loading screen keeps moving; the game database waits for all of them, same order as stock.
		StartPacing = true
		// First load: message boxes opened by mods while the game loads (KSP dialogs, KSPe message boxes such as TweakScale's)
		// are held back and shown at the main menu, unchanged: no window over the loading screen, no message lost.
		QuietLoading = true
		// Model lookups by name (GetModelPrefab, GetModel, ExistsModel) answered from an index instead of a scan of every
		// model: ~4 s of part compilation with 4,000 models. Same answers. Stands down with KSPCF.
		DatabaseIndex = true
		// Rarer GC cycles: tunes the Mono (Boehm) GC free space divisor and pre-grows the heap. Uses more RAM.
		HeapPadder = true
		// Chooses when the GC works: extra incremental GC while paused/in menus, GC held off during staging/explosions.
		GCWindows = true
		// Overlay (Alt+F10) and one performance summary line per minute in KSP.log.
		PerfHUD = true
		// Press Alt+F11 to measure every mod's Update/LateUpdate/FixedUpdate for a few seconds; report in KSP.log.
		ModProfiler = true
		// Runs listed Update/LateUpdate methods of other mods less often when FPS drop. Does nothing until you add TARGETs.
		ThrottleGuard = true
		// Caps how many dynamic lights registered by mods (explosion flashes...) are on at once. Never touches stock lights.
		LightBudget = true
		// Part highlighting (Highlight FX): its full-screen passes (clear, blur, composite) are skipped on frames where no
		// part is highlighted, where they draw nothing. Same image (2.7 ms per frame on the Mac at 2560x1600).
		HighlightIdle = true
		// Flight speed display: its text is formatted again only when the shown value changes (garbage every frame).
		HudText = true
		// EXPERIMENTAL, Windows only: pre-compiles all loaded shaders once at the main menu (first explosion without hitch).
		// Froze KSP for 18+ minutes on a Mac M4, so it is refused on macOS. May freeze the menu for a long time once.
		ShaderWarmup = false
		// Hyperspace jump animation while the game loads, dropping out at the main menu.
		WarpScreen = true
		// OPT-IN, changes the image: the scene is drawn with fewer pixels and upscaled with AMD FSR 1 (the UI stays sharp).
		// More FPS when the graphics card limits the frame (Mac M4: 25 -> 17 ms with 56 % of the pixels). Alt+F9 switches it.
		Upscaler = false
		// Loading animations for every scene change after the first load (space centre, editors, flight, revert...),
		// over KSP's black loading mask; same screens and main menu choice as the start screen.
		SceneLoadScreen = true
		// Writes which GameData folder costs how much loading time (textures, models, audio, configs, parts) to KSP.log.
		LoadReport = true
		// Compiles every mod's code ahead of time on a background thread at the main menu: no first-use hitches
		// (first explosion, first window...). Costs some memory for the compiled code.
		JitPrewarm = true
		// First load: DDS textures read ahead on a background thread, built exactly as stock, without extra copies.
		// Stands down with KSPCF or another DDS loader.
		FastLoader = true
		// Expansion bundles (Making History, Breaking Ground) opened asynchronously instead of freezing the loading screen
		// for ~6 s and ~12 s; MD5 computed in the background (same hash). Stands down with KSPCF.
		AsyncExpansions = true
		// First load: the forced terrain build that places the Making History launch sites (~2 s in one frozen frame) is
		// spread over the 2 s wait that stock does right after it. Same stock calls in the same order, same site position.
		LaunchSitePacing = true
		// First load: the asset bundle definitions (226 bundles in a stock install, read one per frame) are read with the
		// same requests sent ahead, a few at a time, and without waiting a frame for what is already there. Same order.
		BundleDefinitions = true
		// Part and module event/action delegates (KSPEvent, KSPAction) bound to the method found once per type and name
		// instead of a lookup by name for every part and module created (first load and every vessel loaded later).
		DelegateCache = true
		// Part config values (PART node fields) set through cached field and parser lookups instead of three lookups by name
		// per value. Left to KSPCommunityFixes PartParsingPerf when that is enabled.
		PartValueCache = true
		// Scene changes: the save the game has just written is parsed on a worker thread, and the next scene takes that
		// result instead of reading the file again on the main thread (same parser, same file, checked unchanged).
		// Left to KSPCommunityFixes SceneLoadSpeedBoost when that is enabled.
		SavePrefetch = true
		// Skips the stock per-part buoyancy update on vessels that are certainly far from water. Stands down with KSPCF.
		BuoyancyGuard = true
		// Parts slower than 0.5 m/s (landed, on the pad) refresh their aerodynamics every few physics steps only.
		AeroIdleThrottle = true
		// OFF: stops reassigning unchanged rigidbody mass/center of mass every physics step. Measured on a modded install
		// (B9PartSwitch, FAR...): it changes the result (hottest skin +0.16 K over 90 s), so it is not neutral. Stands down
		// with KSPCF.
		MassUpdateGuard = false
		// Thermally calm vessels (subsonic or in vacuum, every part below half its limits) integrate heat every 3 physics
		// steps instead of every step; the stock model accumulates the heat in between. Stands down with KSPCF; runs with MFI (FAR, Kopernicus) unless a mod took that step.
		ThermalCadence = true
		// Reuses the sun/planet shading of parts while the direction seen from the vessel barely moves. Stands down with KSPCF; runs with MFI unless a mod took that step.
		OcclusionCache = true
		// Skips handing zero forces/torques to the physics engine for every part every step (no effect, by Unity's definition).
		ZeroForceGuard = true
		// Fixes for stock exceptions (engine sound fade after the part is destroyed). Stands down with KSPCF.
		StockFixes = true
		// Stock leak: resource sets replaced on every vessel rebuild stay subscribed to flow events forever (the game
		// slows down over a session; a minute-long freeze loading big vessels whose tanks a mod reconfigures). Replaced
		// sets nothing references any more are unsubscribed. Stands down with KSPCF.
		LeakFixes = true
		// Stock leak: every terrain start adds one more update coroutine of the same sphere, never stopped (6 ms of every frame
		// after an evening of play). Only the newest goes on, as in a freshly started game. Stands down with KSPCF.
		TerrainCoroutines = true
		// New launch: the launch site's terrain is built once instead of built, thrown away and built again (~1 s per
		// launch), as when a saved flight is loaded. Stands down with KSPCF.
		LaunchTerrain = true
		// Crashes: a dying part's vessel rebuilds its resource sets once per destruction cascade instead of once per
		// detached piece (as KSP does when staging). Stands down with KSPCF.
		CrashFixes = true
		// Config file writes (part database, saves, mods' settings) that fail only because another program holds the file for
		// a moment (antivirus, indexing) are tried again a few times instead of failing (a first load could hang there).
		SaveRetry = true
		// Logs where frame time goes (scripts, physics simulation, rendering) once per interval in flight.
		FrameTimeline = true
		// Developer tool: rendering inventory, per-camera times, optional diagnostic experiments. Off by default.
		RenderProbe = false
		// Developer tool: times each step of the planetary system build at the end of loading. Off by default.
		PSystemTrace = false
		// Developer benchmark; inert unless PluginData/autobench.cfg exists.
		AutoBench = true
	}

	Probe
	{
		// List every Harmony patch owner and the methods patched by several mods when the main menu loads.
		auditHarmonyAtMainMenu = true
	}

	LogSpamGuard
	{
		// Identical messages allowed per window before suppression.
		maxRepeats = 5
		// Window length in seconds; a summary line is written when it ends.
		windowSeconds = 10
		// Distinct messages tracked at once; beyond that, new messages pass through untracked.
		maxTrackedMessages = 2048
	}

	HeapPadder
	{
		// A GC cycle starts after about (live data / divisor) bytes are allocated. Game default is usually 3.
		// 'auto' = 1 with 24 GB+ RAM, 2 with 12 GB+, otherwise unchanged. Lower = rarer GC, bigger heap. 1..10.
		freeSpaceDivisor = auto
		// Grow the heap once at startup instead of in many steps. 'auto' = 1024 / 512 / 256 MB by RAM. 0 = off.
		preExpandMB = auto
		// Safety valve: if the heap exceeds this share of system RAM, the divisor is raised back step by step.
		maxHeapPercentOfRam = 40
		// Divisor used only while the game is loading (fewer GC cycles = faster loading). 0 = off.
		loadingDivisor = 1
		// EXPERIMENTAL, off: where the Boehm knobs are not exported (Windows), suspend automatic GC while loading and run
		// one full collection per this share of RAM of heap growth. Measured unsafe: the first loading frame is one
		// ~22 s frame that allocated 18 GB without a single collection (checks only run between frames). 0 = off.
		managedLoadingGrowthPercentOfRam = 0
	}

	GCWindows
	{
		// Time budget of each incremental GC step, in ms. 0 = keep the game's value (3 ms).
		incrementalSliceMs = 0
		// In Space Center, Tracking Station, editor and main menu, give GC cycles already in progress this much extra time per frame.
		quietCollect = true
		quietBudgetMs = 4
		// When the game is paused in flight (Esc menu), run one full collection if at least this much was allocated since the last GC.
		collectWhenPaused = true
		pausedCollectTriggerMB = 64
		// ...but not when more than this much heap is in use (the pause menu would freeze: ~1 s for 5 GB), and never
		// again in the session once one took longer than pausedCollectMaxMs.
		pausedCollectMaxHeapMB = 1536
		pausedCollectMaxMs = 200
		// Hold the GC off during staging, decoupling, explosions, part destruction and crashes (flight only).
		holdOnFlightEvents = true
		holdSeconds = 1.5
		// Hard limits of one hold, then a cooldown before the next one.
		maxHoldSeconds = 4
		holdMaxGrowthMB = 384
		holdCooldownSeconds = 10
		// No hold during the first seconds after a scene loads.
		sceneGraceSeconds = 5
	}

	PerfHUD
	{
		showAtStartup = false
		// Any Unity KeyCode name. With toggleWithAlt, Alt (Option on Mac) must be held.
		toggleKey = F10
		toggleWithAlt = true
		// One summary line in KSP.log every N seconds (0 = off).
		logIntervalSeconds = 60
		// Frames longer than this count as spikes.
		spikeThresholdMs = 50
	}

	ModProfiler
	{
		toggleKey = F11
		toggleWithAlt = true
		sampleSeconds = 15
		// Number of methods listed in the report.
		reportTop = 20
		// Also profile automatically once when the first flight scene loads.
		profileOnFlightStart = false
		// Also measure the stock game's own scripts (FlightIntegrator, Part...), for comparison.
		includeStock = false
	}

	ThrottleGuard
	{
		// 'auto' = only in flight and only while FPS are low; 'always' = always at throttledHz (testing).
		mode = auto
		engageBelowFps = 40
		disengageAboveFps = 50
		// Rate the listed methods run at while engaged.
		throttledHz = 15
		// Add targets in PluginData/Hyperdrive.user.cfg, one per method, ONLY for visual/UI work
		// (a method integrating Time.deltaTime would lose the skipped time). Find heavy ones with the ModProfiler (Alt+F11).
		// TARGET
		// {
		//     type = SomeNamespace.SomeVisualModule
		//     method = Update
		// }
	}

	LightBudget
	{
		// Mod-registered dynamic lights allowed on at the same time (each pixel light costs a lot of GPU).
		maxLights = 8
	}

	StartPacing
	{
		// Instantly add-ons whose Start may begin per frame (doubles while frames stay under frameBudgetMs).
		maxPerFrame = 32
		frameBudgetMs = 20
		// Everything left is released at once after this long.
		timeoutSeconds = 60
		// Add-on class names (comma separated) that always start in the stock frame.
		exclude =
	}
	ShaderWarmup
	{
		// Seconds after the main menu appears.
		delaySeconds = 2
	}

	LoadReport
	{
		// GameData folders listed in the report.
		reportTop = 25
	}

	BuoyancyGuard
	{
		// Extra safety distance (m) added to the stock limits before a vessel counts as far from water.
		marginMeters = 10
	}

	AeroIdleThrottle
	{
		// Below this speed (m/s) aerodynamic forces are negligible (about 0.15 Pa of dynamic pressure at sea level).
		speedThreshold = 0.5
		// Slow parts refresh their aerodynamics once every N physics steps (each part at its own phase).
		interval = 5
	}

	ThermalCadence
	{
		// Calm vessels integrate heat once every N physics steps (2 or 3; 3 = 0.06 s, below the stock 0.07 s one-pass bound).
		interval = 3
		// Above this Mach number (reentry, supersonic flight) every step runs stock.
		machThreshold = 0.8
		// If any part is above this fraction of its core or skin temperature limit, every step runs stock.
		maxTemperatureRatio = 0.5
	}

	FrameTimeline
	{
		// Seconds between two log lines in flight.
		logIntervalSeconds = 60
	}



	OcclusionCache
	{
		// Recompute when the sun or planet direction, seen from the vessel, has moved more than this.
		maxAngleDegrees = 0.5
		// Recompute at least this often anyway (vessel flex, deployed fairings or panels).
		maxAgeSeconds = 1
	}

	WarpScreen
	{
		// Loading screen: random (no repeats across starts: every screen plays once before any comes back) or one of the
		// names below. The main menu button "Loading screens" overrides this (PluginData/LoadingScreens.cfg).
		//   hyperspace, vortex, nebula, orbit (star fields)
		//   blueprint, survey, navball, checklist, launchpad, mun, ascent, ksc, aurora, polar, splashdown, reentry,
		//   staging, jool (KSP)
		//   rain, forest, campfire, ripples, city, lighthouse (away from space)
		//   struts, rud, rover, boosters, kraken, bounce (KSP jokes)
		//   flip, twr, chute, runway, debris (KSP memes)
		style = random
		// A little surprise crosses the screen now and then (about one start in twenty).
		easterEgg = true
		// Frozen frames (the game busy in one long call: nothing can be drawn) are covered: the animation pauses instead of
		// jumping ahead, and the places where this install's load froze (PluginData/LoadingFreezes.txt, learned at each
		// start, for these mods only) are approached with the animation slowed to a near stillness, so they read as a pause.
		coverFreezes = true
		// A title sequence before the animation, as games open with (about 4 s, while the game keeps loading).
		intro = true
		// Stars in the field (300 to 6000).
		stars = 2600
		// The two scene loads that end the first load (planetary system, main menu) run asynchronously while the
		// animation is on screen, so it keeps moving instead of freezing for ~6 s.
		asyncSceneLoads = true
		// The animation paces the loaders to the display refresh rate (60 Hz minimum), up to this rate.
		maxRefreshRate = 144
	}

	Compatibility
	{
		// Jobs done both by Hyperdrive and by KSPCommunityFixes: only one of the two runs, the faster one on this install.
		//   ours = Hyperdrive's (KSPCF's patch is turned off, as its own setting would), theirs = KSPCF's (Hyperdrive's stands
		//   down), auto = learned on this install: one job at a time, successive starts alternate the two versions and a
		//   neutral measure decides (flight: physics scripts time per part and physics step, compared within the same
		//   situation); kept in PluginData/Overlaps.txt with this install's mods and machine, learned again when they change.
		//   Without a neutral measure, auto is the default measured by the Hyperdrive authors.
		learnOverlaps = true
		PREFER
		{
			// Hyperdrive by default: LZ4 copies opened in 0.2-0.3 s instead of the original LZMA bundles in 10-13 s.
			ExpansionBundlePreload = auto
			// Learned in flight (KSPCF until then).
			FlightIntegratorPerf = auto
			OnDemandPartBuoyancy = auto
			// Learned at the first game load of a session (KSPCF until then).
			SceneLoadSpeedBoost = auto
			// KSPCF by default (no neutral measure while playing: tools/overlaps runs both and tells which to set).
			FasterEditorPartList = auto
			// Game bug fixes: KSPCF's domain.
			PQSCoroutineLeak = auto
			PQSOnlyStartOnce = auto
			// Other mods' patches (Assembly:PatchClass = ours): removed from a method a Hyperdrive subsystem also changes,
			// instead of that subsystem standing down. Only after measuring that Hyperdrive's version is better here.
		}
		// Older setting, still read: KSPCF patches taken over by Hyperdrive (same as PREFER ... = ours).
		keepOurs =
		// Any mod that replaces a stock method a Hyperdrive optimization also changes (a transpiler, or a prefix that can
		// skip the method) keeps its version and the Hyperdrive optimization stands down (checked at the main menu, the
		// first space centre and the first flight). false: only for the optimization mods listed below.
		yieldToAllMods = true
		// More optimization mods (assembly names): a Hyperdrive fix stands down if one of them replaces a method it patches.
		optimizerAssemblies =
		// After a game session that ended abruptly (crash, killed: no normal quit), the next start is prudent: the
		// optimizations at work where the game stopped stay off for that one start, and a notice says so. The start after is
		// normal again (never two prudent starts in a row). Nothing is written to your settings.
		prudentStart = true
		// Every patch is made for KSP 1.12: on another version only the read-only parts (diagnostics, window) run.
		allowOtherGameVersions = false
	}

	AsyncExpansions
	{
		// Starts opening the expansion bundles as soon as Hyperdrive loads, while the game database loads on the main thread,
		// instead of when KSP reaches them (~17 s with nothing else loading). Same bundles, handed to KSP at the same step.
		preopen = true
		// The expansion bundles ship as one LZMA block each, decompressed whole before they open (~7-12 s). At the main
		// menu, a copy recompressed by Unity to LZ4 chunks (same content, ~720 MB for both expansions) is written in the
		// background to PluginData/BundleCache and opened instead at later starts (~0.2 s). Used only while the original
		// keeps its size, date and MD5; otherwise the original is opened and the copy made again. Game files never change.
		lz4Cache = true
		// The copies are only written while the disk keeps at least this much free space (GB).
		cacheMinFreeGB = 4
	}

	Upscaler
	{
		// Rendered size per axis (0.5 to 1): 0.75 = 56 % of the pixels, 0.67 = 45 %, 0.5 = 25 %.
		scale = 0.75
		// FSR sharpening, in stops: 0 = sharpest, 2 = none (the sharpening pass is skipped).
		sharpness = 0.2
		// Cameras up to this depth are drawn at the reduced size (KSP: galaxy -4, scaled space -3, far -1, near 0).
		maxSceneDepth = 0
		scenes = FLIGHT,SPACECENTER,TRACKSTATION
		// Alt + this key switches the upscaler on and off in game.
		toggleKey = F9
		// Dynamic resolution (like Lossless Scaling's scaling, inside the game): the rendered size follows the load in
		// steps of 10 % per axis, between minScale and maxScale. Lowered when frames stay slower than the target, raised
		// when there is spare speed; a step that does not make frames faster (CPU-bound) is undone. At 1 the image is
		// native (no upscaling pass). targetFps = 0: the frame limit or vsync rate, else the screen refresh rate.
		dynamic = false
		minScale = 0.6
		maxScale = 1
		targetFps = 0
		// With dynamic: when the CPU is the limit (frames no faster at a smaller size), the graphics card has time to spare and
		// renders the scene above 100 % (steps of 25 %, up to maxSupersample), scaled down: a sharper image at the same FPS.
		// A step that costs FPS is undone. Opt-in (it changes the image).
		supersample = false
		maxSupersample = 1.5
	}

	LaunchTerrain
	{
		// false: the launch terrain is built twice, as stock (for comparison).
		skipSecondBuild = true
	}

	LaunchSitePacing
	{
		// false: stock build in one frame (the terrain and launch site fingerprint is still logged, for comparison).
		spread = true
	}

	FastLoader
	{
		// Main-thread time per frame before the loading screen gets a frame (when WarpScreen is off; with WarpScreen the
		// budget follows the display refresh rate).
		frameBudgetMs = 50
		// PNG textures: on (read ahead and decoded like stock), off (stock), verify (stock, then every PNG is rebuilt
		// and compared byte for byte with what stock loaded; result in KSP.log). Verified identical on a stock install.
		png = on
		// PNG cache: the texture each PNG becomes (after decoding and compression) is kept in PluginData/PngCache and
		// loaded directly on the next launches, while the PNG is unchanged (size and date). Same bytes as stock (checked
		// by png = verify: 626 of 626 identical). ~71 MB for a stock install; delete the folder at any time. Not written
		// when the disk has less than pngCacheMinFreeGB free. Files of PNGs no longer installed are removed on their own.
		// true (default): on, without asking; ask: the player is asked once with the time saved and the space it takes.
		pngCache = true
		// Threads reading the DDS and cached textures (0 = automatic: half the cores minus one, 1 to 6).
		readerThreads = 0
		// Direct path: DDS and cached PNG textures are created without Unity's zero fill and the reader threads write the
		// file's pixel bytes straight into them (no copy on the main thread). Same textures as stock (checked byte for byte:
		// 3973 of 3973 identical on a heavy modpack).
		ddsDirect = true
		pngCacheMinFreeGB = 4
		// Sounds: the stock audio requests are started ahead (a few dozen at a time) while the textures load. Same sounds.
		audio = true
		audioRequests = 32
	}

	JitPrewarm
	{
		// Seconds after the main menu appears.
		delaySeconds = 3
		// Also precompile the stock game's code (much larger: longer background work, more memory).
		includeStock = false
	}

	LoadProblems
	{
		showOnLoadingScreen = true
		// A window listing every problem when the main menu appears.
		menuWindow = true
		// The loading screen shows a short notice (a few seconds, again when a new problem appears) naming the last
		// problems: how many of them (the window and KSP.log list them all).
		lines = 2
		// Messages left out, separated by ';' (harmless messages of a given setup).
		ignore = Steamworks is not initialized;Failed to initialize Steam API
	}

	IconPrewarm
	{
		// Time per frame spent creating icons ahead, and the wait after the editor opens before starting.
		budgetMs = 3
		delaySeconds = 1
	}
}
