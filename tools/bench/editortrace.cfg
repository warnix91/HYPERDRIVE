// Editor part list investigation (use with editor_search.cfg): the list's refresh steps and every Awake/Start/OnEnable,
// timed during a window opened at the first search. Adds time: never use it for the search figures themselves.
HYPERDRIVE
{
	SUBSYSTEMS
	{
		PSystemTrace = true
	}
	PSystemTrace
	{
		window = editor
		windowSeconds = 22
		lifecycle = true
		longFrameMs = 40
		reportTop = 50
		TARGET
		{
			type = KSP.UI.Screens.EditorPartList
			method = UpdatePartIcons
		}
		TARGET
		{
			type = KSP.UI.Screens.EditorPartList
			method = UpdatePartIcon
		}
		TARGET
		{
			type = KSP.UI.Screens.EditorPartList
			method = ClearAllItems
		}
		TARGET
		{
			type = KSP.UI.Screens.EditorPartList
			method = RefreshSearchList
		}
		TARGET
		{
			type = KSP.UI.Screens.EditorPartList
			method = RefreshPartList
		}
		TARGET
		{
			type = KSP.UI.Screens.BasePartCategorizer
			method = PartMatchesSearch
		}
		TARGET
		{
			type = KSP.UI.Screens.EditorPartIcon
			method = Create
		}
		TARGET
		{
			type = KSP.UI.Screens.EditorPartIcon
			method = SetGrey
		}
		TARGET
		{
			type = KSP.UI.Screens.EditorPartIcon
			method = UnsetGrey
		}
		TARGET
		{
			type = KSP.UI.Screens.EditorPartIcon
			method = Update
		}
		TARGET
		{
			type = KSP.UI.Screens.EditorPartIcon
			method = LateUpdate
		}
	}
}
