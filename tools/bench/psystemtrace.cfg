// Loading freeze investigation: every optimization at its default, plus PSystemTrace with every Awake/Start/OnEnable
// timed from the end of GameDatabase loading to the main menu. Adds startup time: never use it for load-time figures.
HYPERDRIVE
{
	SUBSYSTEMS
	{
		PSystemTrace = true
	}
	PSystemTrace
	{
		lifecycle = true
		longFrameMs = 100
		reportTop = 60
		TARGET
		{
			type = Kopernicus.Injector
			method = PostSpawnFixups
		}
		TARGET
		{
			type = Kopernicus.RuntimeUtility.MeshPreloader
			method = Run
		}
		TARGET
		{
			type = PQS
			method = BuildSphere
		}
		TARGET
		{
			type = PQS
			method = UpdateQuads
		}
		TARGET
		{
			type = PQS
			method = UpdateQuadsInit
		}
		TARGET
		{
			type = PQS
			method = SetupMods
		}
		TARGET
		{
			type = GameDatabase
			method = CompileConfig
		}
		TARGET
		{
			type = ExpansionsLoader
			method = StartLoad
		}
	}
	PerfHUD
	{
		logIntervalSeconds = 15
	}
	FrameTimeline
	{
		logIntervalSeconds = 15
	}
}
