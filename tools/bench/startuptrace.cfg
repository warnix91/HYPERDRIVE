// Startup freeze investigation: what KSP does between launch and the first file loaded (config tree built twice,
// localization, Instantly addons). PSystemTrace records from Hyperdrive's start. Never use it for load-time figures.
HYPERDRIVE
{
	SUBSYSTEMS
	{
		PSystemTrace = true
	}
	PSystemTrace
	{
		fromDatabaseLoaded = false
		lifecycle = true
		longFrameMs = 300
		reportTop = 60
		TARGET
		{
			type = UrlDir
			method = .ctor
		}
		TARGET
		{
			type = UrlDir
			method = Create
		}
		TARGET
		{
			type = UrlDir+UrlFile
			method = .ctor
		}
		TARGET
		{
			type = UrlDir+UrlFile
			method = AddConfig
		}
		TARGET
		{
			type = UrlDir+UrlConfig
			method = CreateNodeList
		}
		TARGET
		{
			type = ConfigNode
			method = Load
		}
		TARGET
		{
			type = ConfigNode
			method = Parse
		}
		TARGET
		{
			type = GameDatabase
			method = translateLoadedNodes
		}
		TARGET
		{
			type = GameDatabase
			method = SetupMainLoaders
		}
		TARGET
		{
			type = GameDatabase
			method = LoadObjects
		}
		TARGET
		{
			type = GameDatabase
			method = CreateDatabase
		}
		TARGET
		{
			type = AddonLoader
			method = StartAddons
		}
		TARGET
		{
			type = AddonLoader
			method = StartAddon
		}
		TARGET
		{
			type = KSP.Localization.Localizer
			method = SwitchToLanguage
		}
		TARGET
		{
			type = AssemblyLoader
			method = LoadAssemblies
		}
		TARGET
		{
			type = PartLoader
			method = StartLoad
		}
	}
}
