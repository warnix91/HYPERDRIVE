// Crash freeze (use with -BenchCfg crash.cfg): explodetrace plus the part-death and part-count handlers of the mods
// seen in the crash frame (VEFX, Firefly), to see who takes the time.
// Explosion freezes: PSystemTrace in flight-window mode (opened by AutoBench at the first explosion or the crash), with the
// game's Awake/Start/OnEnable timed (explosion effects instantiated) and the explosion, part death and vessel split steps.
HYPERDRIVE
{
	SUBSYSTEMS
	{
		PSystemTrace = true
	}
	PSystemTrace
	{
		window = flight
		windowSeconds = 14
		lifecycle = true
		// every GameEvents subscriber (stock and mods) timed too
		eventHandlers = true
		// 4M calls (~200 MB): the crash frames of a heavily modded game fit; per-part FixedUpdate targets are left out
		maxCalls = 4194304
		longFrameMs = 40
		reportTop = 60
		TARGET
		{
			type = FXMonger
			method = explode
		}
		TARGET
		{
			type = FXMonger
			method = Update
		}
		TARGET
		{
			type = FXMonger
			method = LateUpdate
		}
		TARGET
		{
			type = FXMonger
			method = FixedUpdate
		}
		TARGET
		{
			type = FXMonger
			method = SpawnDebrisExplosions
		}
		TARGET
		{
			type = Part
			method = explode
		}
		TARGET
		{
			type = Part
			method = Die
		}
		TARGET
		{
