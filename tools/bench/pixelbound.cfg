// Is the flight frame bound by the number of pixels drawn (what an upscaler would save)? RenderProbe windows with every
// screen camera drawing 0.75 x 0.75 and 0.5 x 0.5 of the screen (56 % and 25 % of the pixels), baselines in between.
HYPERDRIVE
{
	SUBSYSTEMS
	{
		RenderProbe = true
	}
	RenderProbe
	{
		experiments = true
		experimentStartSeconds = 20
		experimentWindowSeconds = 8
		experimentList = viewport:0.5;viewport:0.75;viewport:0.5;viewport:0.75;viewport:0.5;viewport:0.75
	}
}
