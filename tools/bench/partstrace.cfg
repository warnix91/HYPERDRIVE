// Part compilation investigation: stock PartLoader steps timed, every Awake/Start/OnEnable too, from the end of
// GameDatabase loading to the main menu. Adds time: never use it for load-time figures.
HYPERDRIVE
{
	SUBSYSTEMS
	{
		PSystemTrace = true
	}
	PSystemTrace
	{
		lifecycle = true
		longFrameMs = 200
		reportTop = 70
		TARGET
