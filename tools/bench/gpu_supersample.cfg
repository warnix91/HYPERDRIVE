// PC (CPU-bound): let the graphics card render above 100 % when the CPU sets the pace. Put this in
// PluginData/Hyperdrive.user.cfg to play with it, or use it as a bench user config.
HYPERDRIVE
{
	SUBSYSTEMS
	{
		Upscaler = true
	}
	Upscaler
	{
		scale = 1
		dynamic = true
		maxScale = 1
		supersample = true
		maxSupersample = 2
	}
}
