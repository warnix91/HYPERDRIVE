// Editor part list: opens the VAB, types each search (";"-separated, empty = cleared) every editorStepSeconds and logs
// the worst frame of each (AutoBench EDITOR line). editorWarmSeconds: time in the editor before the first search.
AUTOBENCH
{
	craft = HyperdriveHeavy
	editor = VAB
	editorSearches = a;fuel;engine;tank;;struct;e;
	editorStepSeconds = 3
	editorWarmSeconds = 4
	quitWhenDone = true
}
