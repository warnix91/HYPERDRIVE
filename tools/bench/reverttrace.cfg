// Revert to launch investigation: every Awake/Start/OnEnable of the game and the mods, plus the vessel spawn steps,
// timed during a 12 s window opened when an AutoBench cycle reverts to launch (use with a cycles bench). Adds time: never use it for scene change figures.
HYPERDRIVE
{
	SUBSYSTEMS
	{
		PSystemTrace = true
	}
	PSystemTrace
	{
		window = revert
		windowSeconds = 12
		lifecycle = true
		longFrameMs = 100
		reportTop = 70
		TARGET
		{
			type = ShipConstruction
			method = LoadShip
		}
		TARGET
		{
			type = ShipConstruction
			method = AssembleForLaunch
		}
		TARGET
		{
			type = ShipConstruction
			method = PutShipToGround
		}
		TARGET
		{
			type = FlightDriver
			method = Start
		}
		TARGET
		{
			type = PQS
			method = ForceStart
		}
		TARGET
		{
			type = PQS
			method = StartSphere
		}
		TARGET
		{
			type = Vessel
			method = Initialize
		}
		TARGET
		{
			type = Part
			method = Start
		}
		TARGET
		{
			type = FlightIntegrator
			method = Setup
		}
		TARGET
		{
			type = PartSet
			method = BuildPartSets
		}
	}
}
