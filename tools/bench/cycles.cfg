// A play session's scene changes before the measured flight: 12 short flights of the heavy craft, ended alternately by a
// revert to launch and by a return to the space centre and a new launch, then 30 s on the pad (no staging).
AUTOBENCH
{
	craft = HyperdriveHeavy
	cycles = 12
	cycleSeconds = 8
	flightSeconds = 30
	firstStageDelaySeconds = 999
	stageIntervalSeconds = 999
	pauseAtSeconds = 0
	quitWhenDone = true
}
