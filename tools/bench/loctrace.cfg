// First load: how often and how long KSP's Localizer is asked for texts (part compiling, module infos), to size a cache.
HYPERDRIVE
{
	SUBSYSTEMS
	{
		PSystemTrace = true
	}
	PSystemTrace
	{
		longFrameMs = 400
		reportTop = 25
		TARGET
		{
			type = KSP.Localization.Localizer
			method = Format
		}
		TARGET
		{
			type = KSP.Localization.Localizer
			method = _Format
		}
		TARGET
		{
			type = KSP.Localization.Localizer
			method = GetStringByTag
		}
		TARGET
		{
			type = PartLoader
			method = ParsePart
		}
		TARGET
		{
			type = PartLoader
			method = CompilePartInfo
		}
		TARGET
		{
			type = PartLoader
			method = CreatePartIcon
		}
	}
}
