// Upscaler on (FSR 1 at 0.75), with RenderProbe windows that switch it off, baselines (on) in between.
// The AutoBench 10 s screenshot is taken with the upscaler on: compare it with a run without this file.
HYPERDRIVE
{
	SUBSYSTEMS
	{
		Upscaler = true
		RenderProbe = true
	}
	RenderProbe
	{
		experiments = true
		experimentStartSeconds = 20
		experimentWindowSeconds = 8
		experimentList = upscaler:off;upscaler:nosharpen;upscaler:0.67;upscaler:0.5;upscaler:off;upscaler:nosharpen;upscaler:0.67;upscaler:0.5
	}
}
